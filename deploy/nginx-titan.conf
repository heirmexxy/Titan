# /etc/nginx/sites-available/titan  (certbot adds the TLS lines)
server {
  server_name titan.kitovu.com.ng;
  client_max_body_size 2m;

  # EMQX hooks are local-only; never expose them.
  location /internal/ { return 404; }

  location / {
    proxy_pass http://127.0.0.1:4600;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# MQTT over WebSocket on 443 for networks that block 8883
server {
  server_name mqtt.titan.kitovu.com.ng;
  location /mqtt {
    proxy_pass http://127.0.0.1:8083/mqtt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
  }
}
