<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan Console</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213D; --ink-soft: #4A5875; --muted: #6B778F; --paper: #EEF2F0; --panel: #FFFFFF; --mist: #D5DEDA; --line: #E4EAE7;
    --grain: #E2B23A; --leaf: #2F7D5B; --leaf-bg: #DDEFE5; --alert: #C8462F; --alert-bg: #F6E3DE; --warn: #9A6A00; --warn-bg: #FBF0D5;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; font-variation-settings: 'wdth' 100; background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.5; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--grain); outline-offset: 2px; }
  h1 { font-variation-settings: 'wdth' 120; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; margin: 0 0 1rem; }
  h2 { font-variation-settings: 'wdth' 112; font-weight: 700; font-size: 1.1rem; margin: 0 0 .75rem; }
  .num { font-variation-settings: 'wdth' 70; font-feature-settings: 'tnum'; }

  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: var(--ink); color: var(--paper); padding: 1.1rem .8rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside .brand { font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 1.35rem; padding: 0 .5rem 1rem; }
  aside .brand span { font-variation-settings: 'wdth' 100; font-weight: 400; font-size: .8rem; color: #AFC0BA; margin-left: .3rem; }
  aside nav a { display: flex; justify-content: space-between; padding: .5rem .6rem; border-radius: 6px; text-decoration: none; color: #DCE6E2; }
  aside nav a:hover { background: #22325A; }
  aside nav a[aria-current="page"] { background: #2A3C66; color: #fff; font-weight: 600; }
  aside nav .badge { background: var(--alert); color: #fff; border-radius: 10px; padding: 0 .45rem; font-size: .8rem; }
  aside .who { margin-top: 1.5rem; padding: .6rem; font-size: .85rem; color: #AFC0BA; border-top: 1px solid #2A3C66; }
  aside .who button { margin-top: .4rem; }
  main { padding: 1.5rem 2rem 3rem; min-width: 0; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: static; height: auto; }
    aside nav { display: flex; flex-wrap: wrap; gap: .2rem; }
    main { padding: 1rem; }
  }

  .panel { background: var(--panel); border: 1px solid var(--mist); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1.25rem; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .grid2 > * { min-width: 0; }
  @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
  .tile { background: var(--panel); border: 1px solid var(--mist); border-radius: 10px; padding: .9rem 1rem; }
  .tile .v { font-size: 2rem; line-height: 1.1; font-variation-settings: 'wdth' 70; font-weight: 600; }
  .tile .l { color: var(--muted); font-size: .88rem; }
  .tile.bad .v { color: var(--alert); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .55rem .6rem .55rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: .85rem; }
  .scroll { overflow-x: auto; }
  td.r, th.r { text-align: right; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #F6F9F7; }

  .pill { display: inline-flex; align-items: center; gap: .3rem; padding: .05rem .5rem; border-radius: 10px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-online, .sev-info { color: var(--leaf); background: var(--leaf-bg); }
  .st-offline, .st-open, .sev-critical { color: var(--alert); background: var(--alert-bg); }
  .st-registered, .sev-warning, .pending { color: var(--warn); background: var(--warn-bg); }
  .st-disabled, .st-resolved, .st-acknowledged { color: var(--muted); background: #EEF1F4; }

  button, .btn { font: inherit; font-weight: 600; padding: .45rem .85rem; border-radius: 6px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.danger { border-color: var(--alert); color: var(--alert); }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: .2rem .55rem; font-size: .85rem; }
  aside button { background: transparent; color: #DCE6E2; border-color: #4A5B7A; }

  form.f { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .75rem; align-items: end; }
  form.f label, .lbl { display: grid; gap: .25rem; font-size: .85rem; color: var(--ink-soft); }
  input, select, textarea { font: inherit; padding: .45rem .55rem; border: 1px solid var(--mist); border-radius: 6px; background: #fff; color: var(--ink); min-width: 0; width: 100%; }
  textarea { min-height: 70px; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .err { color: var(--alert); }
  .ok { color: var(--leaf); }
  .secret { background: var(--warn-bg); border: 1px solid #E8D29A; padding: .75rem 1rem; border-radius: 8px; margin: .75rem 0; word-break: break-all; }
  .secret code { font-size: 1rem; font-weight: 700; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .empty { color: var(--muted); padding: .5rem 0; }
  #toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--ink); color: var(--paper); padding: .7rem 1rem; border-radius: 8px; display: none; max-width: 420px; z-index: 10; }

  /* chart */
  .chart { position: relative; }
  .chart svg { width: 100%; height: 260px; display: block; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: .4rem .6rem; border-radius: 6px; font-size: .82rem; display: none; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .85rem; color: var(--ink-soft); margin-top: .4rem; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .35rem; }

  .login { max-width: 380px; margin: 12vh auto; }
  .login .brand { font-variation-settings: 'wdth' 125; font-weight: 800; font-size: 2rem; margin-bottom: 1rem; }
  .login form { display: grid; gap: .8rem; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>

(() => {
  const app = document.getElementById('app');
  let me = null;
  const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
  const KINDS = ['warehouse', 'aquaponics', 'hydroponics', 'greenhouse', 'cold_room', 'poultry', 'field', 'energy', 'other'];

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const h = (strings, ...vals) => strings.reduce((out, s, i) => out + s + (i < vals.length ? (vals[i] && vals[i].__html !== undefined ? vals[i].__html : esc(vals[i])) : ''), '');
  const raw = (html) => ({ __html: html });
  const ago = (t) => {
    if (!t) return 'never';
    const s = Math.round((Date.now() - new Date(t).getTime()) / 1000);
    if (s < 60) return `${s}s ago`; if (s < 3600) return `${Math.round(s / 60)}m ago`; if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return new Date(t).toLocaleDateString();
  };
  const when = (t) => t ? new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const fmt = (v) => { const n = Number(v); return Number.isFinite(n) ? (Math.abs(n) >= 100 ? n.toFixed(0) : Math.abs(n) >= 10 ? n.toFixed(1) : n.toFixed(2)) : '–'; };
  const pill = (cls, text) => raw(`<span class="pill ${esc(cls)}">${esc(text)}</span>`);
  const toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 4000); };

  async function api(method, path, body) {
    const res = await fetch('/console/api' + path, {
      method, credentials: 'same-origin',
      headers: { ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}), ...(method !== 'GET' ? { 'X-Titan-Console': '1' } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401 && path !== '/login') { me = null; renderLogin(); throw new Error('Signed out'); }
    const text = await res.text();
    const json = text ? JSON.parse(text) : {};
    if (!res.ok) throw new Error(json.message || json.error || `Request failed (${res.status})`);
    return json;
  }
  const formData = (form) => Object.fromEntries(new FormData(form));
  function bindForm(sel, fn) {
    const form = app.querySelector(sel);
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type=submit]');
      const msg = form.querySelector('.form-msg');
      if (btn) btn.disabled = true;
      if (msg) { msg.textContent = ''; msg.className = 'form-msg small'; }
      try { await fn(formData(form), form); }
      catch (err) { if (msg) { msg.textContent = err.message; msg.className = 'form-msg small err'; } else toast(err.message); }
      finally { if (btn) btn.disabled = false; }
    });
  }
  function onClick(sel, fn) {
    app.querySelectorAll(sel).forEach((el) => el.addEventListener('click', async (e) => {
      e.stopPropagation();
      el.disabled = true;
      try { await fn(el.dataset, el); } catch (err) { toast(err.message); } finally { el.disabled = false; }
    }));
  }
  const options = (items, sel, valueKey = 'id', labelFn = (x) => x.name) =>
    raw(items.map((x) => `<option value="${esc(x[valueKey])}" ${String(x[valueKey]) === String(sel) ? 'selected' : ''}>${esc(labelFn(x))}</option>`).join(''));


  // Line chart: one line per channel, crosshair tooltip, legend for 2+ channels.
  async function loadChart(id, metric, hours, meta) {
    const el = app.querySelector('#chart');
    let data;
    try { data = await api('GET', `/devices/${encodeURIComponent(id)}/series?metric=${encodeURIComponent(metric)}&hours=${hours}`); }
    catch (e) { el.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (!data.points.length) { el.innerHTML = '<p class="empty">No readings in this period.</p>'; return; }
    const channels = [...new Set(data.points.map((p) => p.channel))].slice(0, 4);
    const W = 900, H = 260, L = 48, R = 12, T = 12, B = 28;
    const ts = data.points.map((p) => new Date(p.t).getTime());
    const t0 = Math.min(...ts), t1 = Math.max(...ts) || t0 + 1;
    let v0 = Math.min(...data.points.map((p) => p.avg)), v1 = Math.max(...data.points.map((p) => p.avg));
    if (v0 === v1) { v0 -= 1; v1 += 1; }
    const pad = (v1 - v0) * 0.1; v0 -= pad; v1 += pad;
    const x = (t) => L + ((t - t0) / Math.max(1, t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v - v0) / (v1 - v0)) * (H - T - B);
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => v0 + f * (v1 - v0));
    const series = channels.map((ch, i) => ({ ch, color: SERIES[i], pts: data.points.filter((p) => p.channel === ch).map((p) => ({ t: new Date(p.t).getTime(), v: p.avg, min: p.min, max: p.max })) }));
    const tfmt = (t) => new Date(t).toLocaleString([], Number(hours) > 48 ? { month: 'short', day: 'numeric' } : Number(hours) > 6 ? { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' } : { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(meta?.label ?? metric)} over the last ${esc(hours)} hours">
      ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E4EAE7" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6B778F">${fmt(v)}</text>`).join('')}
      <text x="${L}" y="${H - 8}" font-size="11" fill="#6B778F">${esc(tfmt(t0))}</text>
      <text x="${W - R}" y="${H - 8}" font-size="11" fill="#6B778F" text-anchor="end">${esc(tfmt(t1))}</text>
      ${series.map((s) => `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${s.pts.map((p) => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`).join('')}
      <line id="xh" y1="${T}" y2="${H - B}" stroke="#14213D" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>
    </svg><div class="tip"></div>
    ${series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.ch)}</span>`).join('')}</div>` : `<div class="legend"><span>${esc(series[0].ch)} · ${esc(meta?.unit ?? '')} · ${esc(data.bucket)} averages</span></div>`}`;
    const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('#xh');
    const all = [...new Set(series.flatMap((s) => s.pts.map((p) => p.t)))].sort((a, b) => a - b);
    el.querySelector('#hit').addEventListener('mousemove', (e) => {
      const box = svg.getBoundingClientRect();
      const tx = t0 + ((e.clientX - box.left) / box.width * W - L) / (W - L - R) * (t1 - t0);
      const near = all.reduce((a, b) => (Math.abs(b - tx) < Math.abs(a - tx) ? b : a), all[0]);
      xh.setAttribute('x1', x(near)); xh.setAttribute('x2', x(near)); xh.setAttribute('opacity', '0.35');
      const rows = series.map((s) => { const p = s.pts.find((q) => q.t === near); return p ? `<div><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:.35rem"></i>${esc(s.ch)}: <b>${fmt(p.v)}</b> ${esc(meta?.unit ?? '')} <span style="opacity:.7">(${fmt(p.min)}–${fmt(p.max)})</span></div>` : ''; }).join('');
      tip.innerHTML = `<div style="opacity:.75">${esc(new Date(near).toLocaleString())}</div>${rows}`;
      tip.style.display = 'block';
      const px = (x(near) / W) * box.width;
      tip.style.left = Math.min(px + 12, box.width - tip.offsetWidth) + 'px';
      tip.style.top = '8px';
    });
    el.querySelector('#hit').addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('opacity', '0'); });
  }


  // ---------- layout ----------
  const NAV = [['overview', 'Overview'], ['reports', 'Reports'], ['sites', 'Sites'], ['devices', 'Devices'], ['alerts', 'Alerts'], ['rules', 'Alert rules'], ['sharing', 'Sharing'], ['api', 'API & webhooks'], ['carbon', 'Carbon'], ['billing', 'Billing'], ['settings', 'Settings']];
  let openAlerts = 0;
  const isOwner = () => me && me.role === 'client_owner';
  function layout(active, content) {
    app.innerHTML = h`<div class="shell">
      <aside>
        <div class="brand">Titan<span>${me.orgName}</span></div>
        <nav aria-label="Console">${raw(NAV.map(([k, label]) => `<a href="#${k}" ${k === active ? 'aria-current="page"' : ''}>${esc(label)}${k === 'alerts' && openAlerts ? `<span class="badge">${openAlerts}</span>` : ''}</a>`).join(''))}</nav>
        <div class="who">${me.email}<br>${me.support ? 'Kitovu support' : isOwner() ? 'Account owner' : 'Team member'}<br><button class="small" id="logout">Sign out</button></div>
      </aside>
      <main>${raw(me.support ? `<div class="secret" role="status" style="margin-top:0">Kitovu support (${esc(me.support.email)}) is working in this account until ${esc(new Date(me.support.expiresAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}. Reason: ${esc(me.support.reason ?? '')} <button class="small" id="end-support">End support session</button></div>` : '')}${raw(content)}</main>
    </div>`;
    app.querySelector('#logout').onclick = async () => { await api('POST', '/logout'); me = null; renderLogin(); };
    const end = app.querySelector('#end-support');
    if (end) end.onclick = async () => { await api('POST', '/logout'); me = null; window.close(); renderLogin(); };
  }
  function renderLogin() {
    app.innerHTML = `<div class="login panel">
      <div class="brand">Titan</div>
      <p class="muted">Sign in to your organisation's console.</p>
      <form id="login-form">
        <label class="lbl">Email<input name="email" type="email" autocomplete="username" required></label>
        <label class="lbl">Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Sign in</button>
        <p class="form-msg small"></p>
      </form></div>`;
    bindForm('#login-form', async (d) => { await api('POST', '/login', d); me = await api('GET', '/me'); route(); });
  }
  const ownerOnly = (html) => (isOwner() ? html : '');

  const views = {};
  function bindRowLinks() { app.querySelectorAll('tr[data-href]').forEach((tr) => tr.addEventListener('click', () => (location.hash = tr.dataset.href))); }
  function alertTable(alerts) {
    if (!alerts.length) return '<p class="empty">Nothing needs attention.</p>';
    return `<div class="scroll"><table><thead><tr><th>Alert</th><th>Status</th><th>Where</th><th>Opened</th><th></th></tr></thead><tbody>${alerts.map((a) => `
      <tr><td><span class="pill sev-${esc(a.severity)}">${esc(a.severity)}</span> ${esc(a.title)}</td><td><span class="pill st-${esc(a.status)}">${esc(a.status)}</span></td>
      <td>${esc(a.site_name ?? '')}${a.device_id ? `<div class="small"><a href="#device-${esc(a.device_id)}">${esc(a.device_id)}</a></div>` : ''}</td><td class="small">${esc(ago(a.opened_at))}</td>
      <td class="r"><div class="row" style="justify-content:flex-end">${a.status === 'open' ? `<button class="small" data-ack="${esc(a.id)}">Acknowledge</button>` : ''}${a.status !== 'resolved' ? `<button class="small" data-resolve="${esc(a.id)}">Resolve</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>`;
  }
  function bindAlertButtons() {
    onClick('[data-ack]', async (d) => { await api('POST', `/alerts/${d.ack}/ack`); toast('Acknowledged'); route(); });
    onClick('[data-resolve]', async (d) => { await api('POST', `/alerts/${d.resolve}/resolve`); toast('Resolved'); route(); });
  }
  function deviceTable(devices) {
    if (!devices.length) return '<p class="empty">No devices yet.</p>';
    return `<div class="scroll"><table><thead><tr><th>Device</th><th>Status</th><th>Last seen</th></tr></thead><tbody>${devices.map((dv) => `
      <tr class="click" data-href="#device-${esc(dv.id)}"><td><code>${esc(dv.id)}</code><div class="small muted">${esc(dv.site_name ?? '')}</div></td>
      <td><span class="pill st-${esc(dv.status)}">${dv.status === 'registered' ? 'awaiting setup' : esc(dv.status)}</span></td><td class="small">${esc(ago(dv.last_seen_at))}</td></tr>`).join('')}</tbody></table></div>`;
  }

  views.overview = async () => {
    const [{ counts: c, alerts, sites }, { incidents }] = await Promise.all([api('GET', '/overview'), api('GET', '/incidents')]);
    openAlerts = c.open_alerts;
    layout('overview', h`<h1>${me.orgName}</h1>
      <div class="tiles">
        <div class="tile"><div class="v">${c.online}</div><div class="l">Devices online</div></div>
        <div class="tile ${Number(c.offline) ? 'bad' : ''}"><div class="v">${c.offline}</div><div class="l">Devices offline</div></div>
        <div class="tile"><div class="v">${c.awaiting}</div><div class="l">Awaiting setup</div></div>
        <div class="tile ${Number(c.open_alerts) ? 'bad' : ''}"><div class="v">${c.open_alerts}</div><div class="l">Alerts needing attention</div></div>
        <div class="tile"><div class="v">${c.shared_with_us}</div><div class="l">Data shares received</div></div>
        <div class="tile"><div class="v">${Number(c.messages_month).toLocaleString()}</div><div class="l">Messages this month</div></div>
      </div>
      ${raw(incidents.filter((i) => i.status === 'open').map((i) => `<div class="secret" role="status"><b>${esc(i.title)}</b><br>${esc(i.summary)}</div>`).join(''))}
      <div class="grid2">
        <div class="panel"><h2>Alerts</h2>${raw(alertTable(alerts))}</div>
        <div class="panel"><h2>Your sites</h2>${raw(sites.length ? `<table><thead><tr><th>Site</th><th class="r">Online</th></tr></thead><tbody>${sites.map((s) => `<tr class="click" data-href="#site-${esc(s.id)}"><td>${esc(s.name)}<div class="small muted">${esc(s.kind)}</div></td><td class="r num">${s.online}/${s.devices}</td></tr>`).join('')}</tbody></table>` : `<p class="empty">No sites yet.${isOwner() ? ' <a href="#sites">Add your first site</a>.' : ''}</p>`)}</div>
      </div>`);
    bindAlertButtons(); bindRowLinks();
  };

  views.reports = async () => {
    const { reports } = await api('GET', '/reports');

  };

  views.carbon = async () => {
    const { projects } = await api('GET', '/carbon');
    const t = (x) => `${Number(x).toLocaleString(undefined, { maximumFractionDigits: 3 })} tCO₂e`;
    layout('carbon', h`<h1>Carbon</h1>
      ${raw(projects.length ? `<div class="panel"><table><thead><tr><th>Project</th><th class="r">Calculated</th><th class="r">Net</th></tr></thead><tbody>${projects.map((p) => `<tr class="click" data-href="#project-${esc(p.id)}"><td>${esc(p.name)}<div class="small muted">${p.methodology === 'biochar-v1' ? 'Biochar' : 'Cookstoves'}${p.owned ? '' : ' · shared with you'}</div></td><td class="r num">${p.summary.calculated}/${p.summary.activities}</td><td class="r num">${esc(t(p.summary.netTco2e))}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="panel"><p class="empty">No carbon projects. To start one, email <a href="mailto:titan@kitovu.com.ng">titan@kitovu.com.ng</a>.</p></div>')}`);
    bindRowLinks();
  };
  views.project = async (id) => {
    const { project: p, summary, activities } = await api('GET', `/carbon/${id}`);
    const t = (x) => `${Number(x).toLocaleString(undefined, { maximumFractionDigits: 3 })} tCO₂e`;
    layout('carbon', h`<p class="small"><a href="#carbon">Carbon</a></p><h1>${p.name}</h1>
      <div class="tiles"><div class="tile"><div class="v">${t(summary.netTco2e)}</div><div class="l">Net, calculated</div></div><div class="tile"><div class="v">${summary.calculated}/${summary.activities}</div><div class="l">Calculated</div></div></div>
      <div class="panel">${raw(activities.length ? `<table><thead><tr><th>Reference</th><th>When</th><th>Result</th></tr></thead><tbody>${activities.map((a) => `<tr><td>${esc(a.reference ?? a.id.slice(0, 8))}</td><td class="small">${esc(when(a.started_at))}${a.ended_at ? ' → ' + esc(when(a.ended_at)) : ''}</td><td>${a.result?.status === 'ok' ? esc(t(a.result.netTco2e)) : `<span class="muted">${esc(a.result?.status === 'incomplete' ? 'needs data' : a.status)}</span>`}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Nothing recorded yet.</p>')}</div>`);
  };

  views.billing = async () => {
    const { plan, invoices, usage } = await api('GET', '/billing');
    layout('billing', h`<h1>Billing</h1>
      <div class="tiles">
        <div class="tile"><div class="v">${plan ? plan.name : '–'}</div><div class="l">Plan</div></div>
        <div class="tile"><div class="v">${usage.active_devices}</div><div class="l">Active devices this month</div></div>
        <div class="tile"><div class="v">${Number(usage.api_calls).toLocaleString()}</div><div class="l">API calls this month</div></div>
      </div>
      <div class="panel"><h2>Invoices</h2>${raw(invoices.length ? `<table><tbody>${invoices.map((i) => `<tr><td>${esc(i.period)}</td><td class="r num">${esc(i.currency)} ${Number(i.amount).toLocaleString()}</td><td>${i.status === 'paid' ? '<span class="pill st-online">paid</span>' : '<span class="pill pending">due</span>'}</td><td class="r">${i.status === 'open' && isOwner() ? `<button class="small primary" data-pay="${esc(i.id)}">Pay now</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No invoices yet.</p>')}</div>`);
    onClick('[data-pay]', async (d) => { const { url } = await api('POST', `/invoices/${d.pay}/pay`); location.href = url; });
  };

  views.settings = async () => {
    const [{ users, orgId, devicePrefix }, { entries }] = await Promise.all([api('GET', '/team'), api('GET', '/support-log')]);
    layout('settings', h`<h1>Settings</h1>
      <div class="grid2">
        <div class="panel"><h2>Organisation</h2><dl class="kv"><dt>Name</dt><dd>${me.orgName}</dd><dt>Organisation ID</dt><dd><code>${orgId}</code></dd><dt>Device prefix</dt><dd>${devicePrefix ?? 'not assigned'}</dd></dl>
          <h2 style="margin-top:1.2rem">Change your password</h2>
          <form class="f" id="pw-form"><label>Current password<input name="current" type="password" autocomplete="current-password" required></label><label>New password<input name="next" type="password" minlength="10" autocomplete="new-password" required></label><div><button type="submit">Change password</button></div><p class="form-msg small" style="grid-column:1/-1"></p></form></div>
        <div class="panel"><h2>Team</h2><table><tbody>${raw(users.map((u) => `<tr><td>${esc(u.email)}<div class="small muted">${esc(u.name ?? '')}</div></td><td>${u.role === 'client_owner' ? 'Owner' : 'Member'}</td><td class="small">${esc(ago(u.last_login_at))}</td></tr>`).join(''))}</tbody></table>
          <h2 style="margin-top:1.2rem">Kitovu support access</h2>
          ${raw(entries.length ? `<table><tbody>${entries.map((e) => `<tr><td>${esc(e.action === 'support.session_started' ? `Support session opened by ${e.detail?.by ?? e.email ?? 'Kitovu'}: ${e.detail?.reason ?? ''}` : `${e.action}${e.target ? ' · ' + e.target : ''} (${e.email ?? 'Kitovu support'})`)}</td><td class="small">${esc(when(e.time))}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Kitovu support has not accessed this account.</p>')}
          ${raw(ownerOnly(`<form class="f" id="team-form" style="margin-top:1rem"><label>Email<input name="email" type="email" required></label><label>Name<input name="name"></label><label>Role<select name="role"><option value="client_member">Member (view, acknowledge alerts)</option><option value="client_owner">Owner (everything)</option></select></label><div><button type="submit">Add person</button></div><p class="form-msg small" style="grid-column:1/-1"></p></form><div id="team-out"></div>`))}</div>
      </div>`);
    bindForm('#pw-form', async (d) => { await api('POST', '/password', d); me = null; renderLogin(); toast('Password changed. Sign in again.'); });
    bindForm('#team-form', async (d, form) => { const out = await api('POST', '/team', d); form.reset(); app.querySelector('#team-out').innerHTML = h`<div class="secret">${out.email} can sign in at /console with temporary password <code>${out.temporaryPassword}</code>.</div>`; });
  };

  async function route() {
    if (!me) { try { me = await api('GET', '/me'); } catch { return renderLogin(); } }
    const [path, qs] = (location.hash.slice(1) || 'overview').split('?');
    const params = new URLSearchParams(qs || '');
    const m = /^(site|device|project)-(.+)$/.exec(path);
    try { if (m) await views[m[1]](decodeURIComponent(m[2]), params); else await (views[path] || views.overview)(null, params); }
    catch (e) { if (me) toast(e.message); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
